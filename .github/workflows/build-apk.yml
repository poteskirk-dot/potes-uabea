name: Build Potes UABEA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract Potes UABEA
  run: |
    mkdir source
    ZIP=$(find . -maxdepth 1 -type f -name 'Potes-UABEA-Android-Prepared*.zip' -print -quit)
    echo "Using ZIP: $ZIP"
    unzip -q "$ZIP" -d source

      - name: Install .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore
        run: |
          dotnet restore source/UABEA-8/UABEAvalonia/UABEAvalonia.csproj

      - name: Build Potes UABEA APK
        run: |
          dotnet publish \
            source/UABEA-8/UABEAvalonia/UABEAvalonia.csproj \
            -c Release \
            -f net6.0-android31.0 \
            -p:AndroidPackageFormats=apk \
            -p:PublishTrimmed=false

      - name: Find APK
        run: |
          find source -type f -name "*.apk" -print

      - name: Copy APK
        run: |
          APK=$(find source -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" Potes-UABEA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Potes-UABEA
          path: Potes-UABEA.apk
