name: Build UABEA APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check source ZIP
        shell: bash
        run: |
          set -e

          # Find the first available .zip file dynamically if specific name changes
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file was found in the repository root."
            exit 1
          fi

          echo "Using source ZIP:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract UABEA source
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -q "$ZIP" -d source

          echo "Source extracted."

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT=$(find source -name "UABEA.Android.csproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: UABEA.Android.csproj was not found."
            echo ""
            echo "C# projects found:"
            find source -name "*.csproj" -print
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Android workload
        shell: bash
        run: |
          set -e

          dotnet workload install android

      - name: Update Target Framework to Android 14 (API 34)
        shell: bash
        run: |
          set -e

          # Update project files dynamically to net8.0-android34.0
          find source -type f \( -name "*.csproj" -o -name "*.props" -o -name "*.targets" \) -exec sed -i 's/net6.0-android[0-9.]*/net8.0-android34.0/g' {} +
          find source -type f \( -name "*.csproj" -o -name "*.props" -o -name "*.targets" \) -exec sed -i 's/net7.0-android[0-9.]*/net8.0-android34.0/g' {} +
          find source -type f \( -name "*.csproj" -o -name "*.props" -o -name "*.targets" \) -exec sed -i 's/net8.0-android[0-9.]*/net8.0-android34.0/g' {} +

          echo "Target framework updated to net8.0-android34.0"

      - name: Restore Android project
        shell: bash
        run: |
          set -e

          echo "Restoring:"
          echo "$PROJECT"

          dotnet restore "$PROJECT" \
            -p:TargetFramework=net8.0-android34.0 \
            -p:NuGetAudit=false

      - name: Build UABEA
        shell: bash
        run: |
          set -e

          echo "Building UABEA..."

          dotnet publish "$PROJECT" \
            --configuration Release \
            --framework net8.0-android34.0 \
            -p:TargetFramework=net8.0-android34.0 \
            -p:AndroidPackageFormats=apk \
            -p:SupportedOSPlatformVersion=21.0 \
            -p:TargetPlatformVersion=34.0 \
            -p:PublishTrimmed=false \
            -p:RunAOTCompilation=false \
            -p:NuGetAudit=false

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find source -type f -name "*.apk" -print

          APK=$(find source -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: Build completed but no APK was found."
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          cp "$APK" "UABEA.apk"

          echo ""
          echo "Final APK:"
          ls -lh "UABEA.apk"

      - name: Upload UABEA APK
        uses: actions/upload-artifact@v4
        with:
          name: UABEA-Android14
          path: UABEA.apk
          if-no-files-found: error
          fi

          echo "Using EXACT ZIP:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract UABEA source
        shell: bash
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -q "$ZIP" -d source

          echo "Source extracted."

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT=$(find source -name "UABEA.Android.csproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: UABEA.Android.csproj was not found."
            echo ""
            echo "C# projects found:"
            find source -name "*.csproj" -print
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Android workload
        shell: bash
        run: |
          set -e

          dotnet workload install android

      - name: Update Target Framework to Android 14 (API 34)
        shell: bash
        run: |
          set -e

          # Update project files dynamically to net8.0-android34.0
          find source -type f \( -name "*.csproj" -o -name "*.props" -o -name "*.targets" \) -exec sed -i 's/net6.0-android[0-9.]*/net8.0-android34.0/g' {} +
          find source -type f \( -name "*.csproj" -o -name "*.props" -o -name "*.targets" \) -exec sed -i 's/net7.0-android[0-9.]*/net8.0-android34.0/g' {} +
          find source -type f \( -name "*.csproj" -o -name "*.props" -o -name "*.targets" \) -exec sed -i 's/net8.0-android[0-9.]*/net8.0-android34.0/g' {} +

          echo "Target framework updated to net8.0-android34.0"

      - name: Restore Android project
        shell: bash
        run: |
          set -e

          echo "Restoring:"
          echo "$PROJECT"

          dotnet restore "$PROJECT" \
            -p:TargetFramework=net8.0-android34.0 \
            -p:NuGetAudit=false

      - name: Build Potes UABEA
        shell: bash
        run: |
          set -e

          echo "Building Potes UABEA..."

          dotnet publish "$PROJECT" \
            --configuration Release \
            --framework net8.0-android34.0 \
            -p:TargetFramework=net8.0-android34.0 \
            -p:AndroidPackageFormats=apk \
            -p:SupportedOSPlatformVersion=21.0 \
            -p:TargetPlatformVersion=34.0 \
            -p:PublishTrimmed=false \
            -p:RunAOTCompilation=false \
            -p:NuGetAudit=false

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find source -type f -name "*.apk" -print

          APK=$(find source -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: Build completed but no APK was found."
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          cp "$APK" "Potes-UABEA.apk"

          echo ""
          echo "Final APK:"
          ls -lh "Potes-UABEA.apk"

      - name: Upload Potes UABEA APK
        uses: actions/upload-artifact@v4
        with:
          name: Potes-UABEA-Android14
          path: Potes-UABEA.apk
          if-no-files-found: error
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -q "$ZIP" -d source

          echo "Source extracted."

      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT=$(find source -name "UABEA.Android.csproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: UABEA.Android.csproj was not found."
            echo ""
            echo "C# projects found:"
            find source -name "*.csproj" -print
            exit 1
          fi

          echo "Android project found:"
          echo "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Verify Android target
        shell: bash
        run: |
          set -e

          echo "Checking project files..."

          echo ""
          echo "Android target references:"
          grep -R -n \
            "TargetFramework\|TargetFrameworks\|net6.0-android" \
            source \
            --include="*.csproj" \
            --include="*.props" \
            --include="*.targets" || true

          echo ""
          echo "Checking for OLD Android 21 target..."

          if grep -R -n \
            "net6.0-android21" \
            source \
            --include="*.csproj" \
            --include="*.props" \
            --include="*.targets"; then

            echo ""
            echo "ERROR: Android 21 was found in the extracted source."
            echo "The build has been stopped."
            exit 1
          fi

          echo ""
          echo "Android 21 was NOT found."

          echo ""
          echo "Checking for Android 31..."

          if ! grep -R -n \
            "net6.0-android31" \
            source \
            --include="*.csproj" \
            --include="*.props" \
            --include="*.targets"; then

            echo ""
            echo "ERROR: net6.0-android31 was not found."
            exit 1
          fi

          echo ""
          echo "Android 31 target confirmed."

      - name: Install .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Install Android workload
        shell: bash
        run: |
          set -e

          dotnet workload install android

      - name: Restore Android project
        shell: bash
        run: |
          set -e

          echo "Restoring:"
          echo "$PROJECT"

          dotnet restore "$PROJECT" \
            -p:TargetFramework=net6.0-android31.0 \
            -p:NuGetAudit=false

      - name: Build Potes UABEA
        shell: bash
        run: |
          set -e

          echo "Building Potes UABEA..."

          dotnet publish "$PROJECT" \
            --configuration Release \
            --framework net6.0-android31.0 \
            -p:TargetFramework=net6.0-android31.0 \
            -p:AndroidPackageFormats=apk \
            -p:PublishTrimmed=false \
            -p:RunAOTCompilation=false \
            -p:NuGetAudit=false

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find source -type f -name "*.apk" -print

          APK=$(find source -type f -name "*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: Build completed but no APK was found."
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          cp "$APK" "Potes-UABEA.apk"

          echo ""
          echo "Final APK:"
          ls -lh "Potes-UABEA.apk"

      - name: Upload Potes UABEA APK
        uses: actions/upload-artifact@v4
        with:
          name: Potes-UABEA
          path: Potes-UABEA.apk
          if-no-files-found: error
