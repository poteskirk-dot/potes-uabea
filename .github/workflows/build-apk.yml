name: Build Potes UABEA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source ZIP
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir source
          unzip -q Potes-UABEA-Android-Prepared.zip -d source

      - name: Find project
        run: |
          find source -name "UABEA.Android.csproj" -print

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Android workload
        run: dotnet workload install android

- name: Fix Android target
  run: |
    find source -name "*.csproj" -exec sed -i 's/net8.0-android31.0/net6.0-android31.0/g; s/net8.0-android/net6.0-android/g' {} \;

- name: Build APK
  run: |
    PROJECT=$(find source -name "UABEA.Android.csproj" -print -quit)
    dotnet publish "$PROJECT" \
      -c Release \
      -f net6.0-android31.0 \
      -p:AndroidPackageFormats=apk \
      -p:PublishTrimmed=false

      - name: Find APK
        run: |
          find source -name "*.apk" -print

      - name: Copy APK
        run: |
          APK=$(find source -name "*.apk" -print -quit)
          cp "$APK" Potes-UABEA.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Potes-UABEA
          path: Potes-UABEA.apk
