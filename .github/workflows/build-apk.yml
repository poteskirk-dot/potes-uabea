name: Build Potes UABEA APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Find Potes UABEA ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'Potes-UABEA-Android-Prepared*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Potes UABEA ZIP was not found."
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Potes UABEA
        run: |
          rm -rf source
          mkdir source
          unzip -q "$ZIP" -d source

      - name: Find Android project
        run: |
          PROJECT=$(find source -name 'UABEA.Android.csproj' -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: UABEA.Android.csproj was not found."
            find source -name '*.csproj' -print
            exit 1
          fi

          echo "Android project: $PROJECT"
          echo "ANDROID_PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Fix Android target frameworks
        run: |
          echo "Before:"
          grep -R "android21\|android31\|TargetFramework" source \
            --include='*.csproj' \
            --include='*.props' || true

          find source -type f \( -name '*.csproj' -o -name '*.props' \) \
            -exec sed -i -E \
            's/net6\.0-android[0-9.]*/net6.0-android31.0/g' {} \;

          echo "After:"
          grep -R "android21\|android31\|TargetFramework" source \
            --include='*.csproj' \
            --include='*.props' || true

      - name: Install .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install Android workload
        run: |
          dotnet workload install android

      - name: Restore Android project
        run: |
          dotnet restore "$ANDROID_PROJECT" \
            -p:TargetFramework=net6.0-android31.0

      - name: Build Potes UABEA
        run: |
          dotnet publish "$ANDROID_PROJECT" \
            -c Release \
            -f net6.0-android31.0 \
            -p:TargetFramework=net6.0-android31.0 \
            -p:AndroidPackageFormats=apk \
            -p:PublishTrimmed=false \
            -p:RunAOTCompilation=false

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find source -type f -name '*.apk' -print

          APK=$(find source -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          cp "$APK" Potes-UABEA.apk

      - name: Upload Potes UABEA APK
        uses: actions/upload-artifact@v4
        with:
          name: Potes-UABEA
          path: Potes-UABEA.apk
          if-no-files-found: error
