name: Build Potes UABEA APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          ZIP="$(find . -maxdepth 1 -type f -name 'Potes-UABEA-Android-Prepared*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: Potes UABEA ZIP not found."
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi
          echo "Using: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract UABEA source
        run: |
          rm -rf source
          mkdir source
          unzip -q "$ZIP" -d source

      - name: Verify Android target
        run: |
          PROJECT="$(find source -name 'UABEA.Android.csproj' -print -quit)"
          APP="$(find source -name 'UABEAvalonia.csproj' -print -quit)"
          echo "Android project: $PROJECT"
          echo "Avalonia project: $APP"

          if [ -z "$PROJECT" ] || [ -z "$APP" ]; then
            echo "ERROR: Required project files were not found."
            exit 1
          fi

          if grep -R -n 'net6.0-android21' source --include='*.csproj' --include='*.props' --include='*.targets'; then
            echo "ERROR: Old Android 21 target found."
            exit 1
          fi

          grep -R -n 'net6.0-android31.0' source --include='*.csproj' --include='*.props' --include='*.targets'

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Install .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore Android project
        run: |
          dotnet restore "$PROJECT"             -p:TargetFramework=net6.0-android31.0             -p:NuGetAudit=false             --ignore-failed-sources

      - name: Build Potes UABEA APK
        run: |
          dotnet publish "$PROJECT"             -c Release             -f net6.0-android31.0             -p:TargetFramework=net6.0-android31.0             -p:AndroidPackageFormats=apk             -p:PublishTrimmed=false             -p:RunAOTCompilation=false             -p:NuGetAudit=false

      - name: Find APK
        run: |
          APK="$(find source -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            find source -type f | grep -E '\.apk$' || true
            exit 1
          fi
          echo "APK: $APK"
          cp "$APK" Potes-UABEA.apk

      - name: Upload Potes UABEA
        uses: actions/upload-artifact@v4
        with:
          name: Potes-UABEA
          path: Potes-UABEA.apk
          if-no-files-found: error
