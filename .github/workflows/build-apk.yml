name: Build Potes UABEA APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Find Potes UABEA ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'Potes-UABEA-Android-Prepared*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: Potes UABEA ZIP was not found."
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Potes UABEA
        run: |
          rm -rf source
          mkdir source
          unzip -q "$ZIP" -d source

          echo "Project files:"
          find source -name '*.csproj' -print

      - name: Fix Android target framework
        run: |
          echo "Changing Android target from API 21 to API 31..."

          find source -name '*.csproj' -type f -exec \
            sed -i 's/net6\.0-android21\.0/net6.0-android31.0/g' {} \;

          echo "Android targets after modification:"
          grep -R "net6.0-android" source --include='*.csproj' || true

      - name: Install .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Install Android workload
        run: |
          dotnet workload install android

      - name: Find Android project
        run: |
          PROJECT=$(find source -name 'UABEA.Android.csproj' -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: UABEA.Android.csproj not found."
            find source -name '*.csproj' -print
            exit 1
          fi

          echo "Android project: $PROJECT"
          echo "ANDROID_PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Restore
        run: |
          dotnet restore "$ANDROID_PROJECT"

      - name: Build Potes UABEA
        run: |
          dotnet publish "$ANDROID_PROJECT" \
            -c Release \
            -f net6.0-android31.0 \
            -p:AndroidPackageFormats=apk \
            -p:PublishTrimmed=false \
            -p:RunAOTCompilation=false

      - name: Find APK
        run: |
          echo "Searching for APK..."

          find source -type f -name '*.apk' -print

          APK=$(find source -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced."
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" Potes-UABEA.apk

      - name: Upload Potes UABEA APK
        uses: actions/upload-artifact@v4
        with:
          name: Potes-UABEA
          path: Potes-UABEA.apk
          if-no-files-found: error
